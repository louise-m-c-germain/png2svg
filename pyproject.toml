[project]
name = "png2svg"
version = "0.1.0"
description = "Convert a low-resolution PNG into a scalable hexagonal SVG"
readme = "README.md"
authors = [
    { name = "Louise Germain", email = "louisegermain04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
png2svg = "png2svg.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90